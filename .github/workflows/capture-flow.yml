name: One-login capture flow

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-capture-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Verify one-login capture flow
        run: |
          python -m compileall -q app
          python test_capture_engine.py
          node --check app/static/captureOutbox.js
          node --check app/static/captureOutboxLogic.mjs
          node --check app/static/recorder.js
