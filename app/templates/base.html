<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d251f">
  <title>{% block title %}Bloody Dave's Fragments{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/style.css?v=suite-nav-1">
</head>
<body>
  <header class="topbar">
    <div class="suite-brand">
      <a class="family-control" href="https://control.hope-johnstone.com">5 Million Minutes</a>
      <a class="app-home" href="/"><strong>Fragments</strong></a>
    </div>
    <nav aria-label="Bloody Dave's Suite"><a href="https://recipes.bloodydaves.com">Recipes</a><a class="current" href="/">Fragments</a><a href="https://timer.bloodydaves.com">Quiet Timer</a><a href="https://list.bloodydaves.com">Get List</a><a href="https://lift.bloodydaves.com">Lift Log</a>{% if request.state.authenticated %}<form method="post" action="/auth/logout"><button type="submit">Sign out</button></form>{% endif %}</nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="suite-footer">Part of the independently run Bloody Dave's Suite.</footer>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/static/service-worker.js');</script>
  {% block scripts %}{% endblock %}
</body>
</html>
