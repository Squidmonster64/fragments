{% extends "base.html" %}
{% block title %}{{ fragment.fragment_code }} — {{ fragment.title }}{% endblock %}
{% block content %}
<section class="editor">
  <div class="editor-heading">
    <div><p class="eyebrow">{{ fragment.fragment_code }}</p><h1>{{ fragment.title }}</h1></div>
    <a class="secondary-button" href="/fragments/{{ fragment.id }}/export">Export Markdown</a>
  </div>
  <audio controls preload="metadata" src="/audio/{{ fragment.id }}"></audio>
  {% if request.query_params.get('saved') %}<p class="saved">Saved.</p>{% endif %}
  <form method="post">
    <label>Title<input name="title" value="{{ fragment.title }}" required></label>
    <div class="two-col">
      <label>Status<input name="status" value="{{ fragment.status }}"></label>
      <label>Themes<input name="themes" value="{{ fragment.themes }}" placeholder="Memory, travel, identity"></label>
    </div>
    <label>Cross references<input name="cross_references" value="{{ fragment.cross_references }}" placeholder="F001, F002"></label>
    <label>Original dictation<textarea name="raw_transcript" rows="10">{{ fragment.raw_transcript }}</textarea></label>
    <label>Edited version<textarea name="edited_version" rows="14">{{ fragment.edited_version }}</textarea></label>
    <label>Notes<textarea name="notes" rows="5">{{ fragment.notes }}</textarea></label>
    <button class="save-button" type="submit">Save fragment</button>
  </form>
</section>
{% endblock %}
